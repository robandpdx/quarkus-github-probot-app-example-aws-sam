AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Description: >
  Quarkus GitHub App that comments "Hello word!" on newly opened issues,
  running on AWS Lambda behind an API Gateway HTTP API.

Parameters:
  GitHubAppSecretArn:
    Type: String
    Description: >
      ARN of an existing Secrets Manager secret in the stack's region, containing
      the JSON string fields APP_ID, WEBHOOK_SECRET, and PRIVATE_KEY.
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  GitHubAppSecretsRevision:
    Type: String
    Default: '1'
    MinLength: 1
    Description: >
      Change this non-secret value after rotating the external secret to publish
      a fresh Lambda version and SnapStart snapshot.

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  GitHubAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Runtime: java25
      Architectures:
        - x86_64
      CodeUri: target/function.zip
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubAppSecretArn
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live
      Environment:
        Variables:
          JAVA_TOOL_OPTIONS: >-
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
          GITHUB_APP_SECRET_ARN: !Ref GitHubAppSecretArn
          GITHUB_APP_SECRETS_REVISION: !Ref GitHubAppSecretsRevision
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            Path: /
            Method: POST

Outputs:
  WebhookUrl:
    Description: Webhook URL to set in the GitHub App configuration
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/'
  GitHubAppFunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt GitHubAppFunction.Arn
